name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Livf.slnx

      - name: Build
        run: dotnet build Livf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Livf.slnx --configuration Release --no-build